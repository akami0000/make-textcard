<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>縦書き画像メーカー</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png" />

    <!-- OGPの設定 -->
    <meta property="og:url" content="https://make-textcard.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="縦書き画像メーカー" />
    <meta
      property="og:description"
      content="テキストを縦書き画像にして保存することができるツールです"
    />
    <meta property="og:site_name" content="縦書き画像メーカー" />
    <meta
      property="og:image"
      content="https://make-textcard.netlify.app//image/ogp.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>

  <body>
    <header class="site-header">
      <div>
        <h1>縦書き画像メーカー</h1>
      </div>
      <a href="https://make-yoko-textcard.netlify.app/"
        >横書き版 <span aria-hidden="true">↗</span></a
      >
    </header>

    <main class="workspace">
      <section class="panel preview" aria-labelledby="preview-heading">
        <div class="panel-heading">
          <h2 id="preview-heading">プレビュー</h2>
          <span class="dimensions">1500 × 2000 px</span>
        </div>
        <div class="preview-stage">
          <img
            class="initial-preview"
            src="assets/initial-preview.png"
            width="540"
            height="720"
            alt="サンプル文章の縦書きプレビュー"
          />
          <canvas
            id="canvas"
            width="1500"
            height="2000"
            role="img"
            aria-label="入力した文章の縦書きプレビュー"
            hidden
            >画像のプレビュー</canvas
          >
        </div>
        <div class="preview-actions">
          <p class="preview-status" role="status">プレビューを準備しています</p>
          <button class="js_downloadButton primary" type="button" disabled>
            PNG画像を保存
          </button>
        </div>
      </section>

      <section class="panel editor" aria-labelledby="editor-heading">
        <div class="panel-heading">
          <h2 id="editor-heading">文章を入力</h2>
        </div>
        <label for="card-body">本文</label>
        <textarea id="card-body" rows="6" aria-describedby="body-hint">
あのイーハトーヴォのすきとおった***風***、夏でも底に冷たさをもつ青いそら</textarea>
        <div class="editor-tools">
          <div class="insert-tools">
            <button class="js_insertButton secondary" type="button">
              ＋ 詞書を挿入
            </button>
            <button id="insert-color-text" class="secondary" type="button">
              ＋ 色替え文字を挿入
            </button>
          </div>
          <a class="preview-link" href="#preview-heading">プレビューを見る ↑</a>
        </div>
        <p class="hint" id="body-hint">
          改行すると左に次の列ができます。<code>***</code>で囲んだ文字には強調色を使います。
        </p>

        <details class="setting">
          <summary>タイトル・付記 <span>任意</span></summary>
          <div class="setting-content">
            <label for="card-title">タイトル</label>
            <textarea
              id="card-title"
              rows="1"
              placeholder="作品のタイトル"
            ></textarea>
            <div class="two-columns">
              <label for="left-note"
                >左下の付記
                <textarea id="left-note" rows="1"></textarea>
              </label>
              <label for="right-note"
                >右下の付記
                <textarea id="right-note" rows="1"></textarea>
              </label>
            </div>
          </div>
        </details>

        <details class="setting font-settings">
          <summary>
            フォント <span class="current-font">LINESeedJP</span>
          </summary>
          <div class="setting-content">
            <div class="font">
              <label class="wf-roundedmplus1c"
                ><input type="radio" class="roundedmplus1c" name="font" /><span
                  class="font-name"
                  >M PLUS Rounded 1c</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-HinaMincho"
                ><input type="radio" class="HinaMincho" name="font" /><span
                  class="font-name"
                  >ひな明朝</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-ShipporiMincho"
                ><input type="radio" class="ShipporiMincho" name="font" /><span
                  class="font-name"
                  >しっぽり明朝</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-SawarabiMincho"
                ><input type="radio" class="SawarabiMincho" name="font" /><span
                  class="font-name"
                  >さわらび明朝</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-SawarabiGothic"
                ><input type="radio" class="SawarabiGothic" name="font" /><span
                  class="font-name"
                  >さわらびゴシック</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-notosansjapanese"
                ><input
                  type="radio"
                  class="notosansjapanese"
                  name="font"
                /><span class="font-name">Noto Sans JP</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-lineseed"
                ><input
                  type="radio"
                  class="lineseed"
                  name="font"
                  checked
                /><span class="font-name">LINESeedJP</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-zenAntique"
                ><input type="radio" class="zenAntique" name="font" /><span
                  class="font-name"
                  >Zen Antique</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-kiwiMaru"
                ><input type="radio" class="kiwiMaru" name="font" /><span
                  class="font-name"
                  >Kiwi Maru</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-zenKakuGothicNew"
                ><input
                  type="radio"
                  class="zenKakuGothicNew"
                  name="font"
                /><span class="font-name">Zen Kaku Gothic New</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-KleeOne"
                ><input type="radio" class="KleeOne" name="font" /><span
                  class="font-name"
                  >Klee One</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-zenKurenaido"
                ><input type="radio" class="zenKurenaido" name="font" /><span
                  class="font-name"
                  >Zen Kurenaido</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-hachiMaruPop"
                ><input type="radio" class="hachiMaruPop" name="font" /><span
                  class="font-name"
                  >Hachi Maru Pop</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-kaiseiDecol"
                ><input type="radio" class="kaiseiDecol" name="font" /><span
                  class="font-name"
                  >Kaisei Decol</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-dotGothic16"
                ><input type="radio" class="dotGothic16" name="font" /><span
                  class="font-name"
                  >DotGothic16</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-Stick"
                ><input type="radio" class="Stick" name="font" /><span
                  class="font-name"
                  >Stick</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-rocknroll"
                ><input type="radio" class="rocknroll" name="font" /><span
                  class="font-name"
                  >RocknRoll One</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-yuseiMagic"
                ><input type="radio" class="yuseiMagic" name="font" /><span
                  class="font-name"
                  >Yusei Magic</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-PottaOne"
                ><input type="radio" class="PottaOne" name="font" /><span
                  class="font-name"
                  >Potta One</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-mochiyPop"
                ><input type="radio" class="mochiyPop" name="font" /><span
                  class="font-name"
                  >Mochiy Pop One</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
              <label class="wf-delaGothicOne"
                ><input type="radio" class="delaGothicOne" name="font" /><span
                  class="font-name"
                  >Dela Gothic One</span
                ><span class="font-sample" aria-hidden="true"
                  >これはサンプル文章です。</span
                ></label
              >
            </div>
          </div>
        </details>

        <details class="setting">
          <summary>サイズ・配色 <span>文字・画像・縁取り</span></summary>
          <div class="setting-content">
            <fieldset class="options">
              <legend>文字のサイズ</legend>
              <div class="choices">
                <label
                  ><input
                    type="radio"
                    class="js_check_font_size text-small"
                    name="font_size_scale"
                    checked
                  />小</label
                >
                <label
                  ><input
                    type="radio"
                    class="js_check_font_size text-medium"
                    name="font_size_scale"
                  />中</label
                >
                <label
                  ><input
                    type="radio"
                    class="js_check_font_size text-large"
                    name="font_size_scale"
                  />大</label
                >
                <label
                  ><input
                    type="radio"
                    class="js_check_font_size text-xlarge"
                    name="font_size_scale"
                  />特大</label
                >
              </div>
            </fieldset>
            <fieldset class="options">
              <legend>キャンバスサイズ</legend>
              <div class="choices">
                <label
                  ><input
                    type="radio"
                    class="js_check_size yokonaga1"
                    name="size"
                    checked
                  />基本 1500 × 2000</label
                >
                <label
                  ><input
                    type="radio"
                    class="js_check_size masikaku"
                    name="size"
                  />正方形 2000 × 2000</label
                >
                <label
                  ><input
                    type="radio"
                    class="js_check_size matiuke"
                    name="size"
                  />スマホ壁紙 2000 × 4000</label
                >
              </div>
            </fieldset>
            <fieldset class="options">
              <legend>背景色</legend>
              <div class="choices">
                <label class="siro"
                  ><input
                    type="radio"
                    class="siro"
                    name="c_color"
                    checked
                  /><span class="swatch" aria-hidden="true"></span>白</label
                >
                <label class="koniro"
                  ><input type="radio" class="koniro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >紺色</label
                >
                <label class="aiiro"
                  ><input type="radio" class="aiiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >藍色</label
                >
                <label class="enjiiro"
                  ><input type="radio" class="enjiiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >臙脂色</label
                >
                <label class="fujiiro"
                  ><input type="radio" class="fujiiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >藤色</label
                >
                <label class="azukiiro"
                  ><input type="radio" class="azukiiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >小豆色</label
                >
                <label class="sakurairo"
                  ><input type="radio" class="sakurairo" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >桜色</label
                >
                <label class="momoiro"
                  ><input type="radio" class="momoiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >桃色</label
                >
                <label class="nezumiiro"
                  ><input type="radio" class="nezumiiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >鼠色</label
                >
                <label class="syuiro"
                  ><input type="radio" class="syuiro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >朱色</label
                >
                <label class="kuro"
                  ><input type="radio" class="kuro" name="c_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >黒色</label
                >
                <label class="picker"
                  ><input type="radio" class="picker" name="c_color" />
                  カラーピッカーで選択
                  <input
                    type="color"
                    class="c_picker"
                    aria-label="背景色を指定"
                /></label>
              </div>
            </fieldset>
            <fieldset class="options">
              <legend>文字色</legend>
              <div class="choices">
                <label class="siro"
                  ><input type="radio" class="siro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >白</label
                >
                <label class="koniro"
                  ><input type="radio" class="koniro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >紺色</label
                >
                <label class="aiiro"
                  ><input type="radio" class="aiiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >藍色</label
                >
                <label class="enjiiro"
                  ><input type="radio" class="enjiiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >臙脂色</label
                >
                <label class="fujiiro"
                  ><input type="radio" class="fujiiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >藤色</label
                >
                <label class="azukiiro"
                  ><input type="radio" class="azukiiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >小豆色</label
                >
                <label class="sakurairo"
                  ><input type="radio" class="sakurairo" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >桜色</label
                >
                <label class="momoiro"
                  ><input type="radio" class="momoiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >桃色</label
                >
                <label class="nezumiiro"
                  ><input type="radio" class="nezumiiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >鼠色</label
                >
                <label class="syuiro"
                  ><input type="radio" class="syuiro" name="ms_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >朱色</label
                >
                <label class="kuro"
                  ><input
                    type="radio"
                    class="kuro"
                    name="ms_color"
                    checked
                  /><span class="swatch" aria-hidden="true"></span>黒色</label
                >
                <label class="picker"
                  ><input type="radio" class="picker" name="ms_color" />
                  カラーピッカーで選択
                  <input
                    type="color"
                    class="ms_picker"
                    aria-label="文字色を指定"
                /></label>
              </div>
            </fieldset>
            <fieldset class="options">
              <legend>強調色（***で囲んだ文字）</legend>
              <div class="choices">
                <label class="siro"
                  ><input type="radio" class="siro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >白</label
                >
                <label class="koniro"
                  ><input type="radio" class="koniro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >紺色</label
                >
                <label class="aiiro"
                  ><input
                    type="radio"
                    class="aiiro"
                    name="ss_color"
                    checked
                  /><span class="swatch" aria-hidden="true"></span>藍色</label
                >
                <label class="enjiiro"
                  ><input type="radio" class="enjiiro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >臙脂色</label
                >
                <label class="fujiiro"
                  ><input type="radio" class="fujiiro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >藤色</label
                >
                <label class="azukiiro"
                  ><input type="radio" class="azukiiro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >小豆色</label
                >
                <label class="sakurairo"
                  ><input type="radio" class="sakurairo" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >桜色</label
                >
                <label class="momoiro"
                  ><input type="radio" class="momoiro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >桃色</label
                >
                <label class="nezumiiro"
                  ><input type="radio" class="nezumiiro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >鼠色</label
                >
                <label class="syuiro"
                  ><input type="radio" class="syuiro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >朱色</label
                >
                <label class="kuro"
                  ><input type="radio" class="kuro" name="ss_color" /><span
                    class="swatch"
                    aria-hidden="true"
                  ></span
                  >黒色</label
                >
                <label class="picker"
                  ><input type="radio" class="picker" name="ss_color" />
                  カラーピッカーで選択
                  <input
                    type="color"
                    class="ss_picker"
                    aria-label="強調色を指定"
                /></label>
              </div>
            </fieldset>
            <fieldset class="options">
              <legend>文字の縁取り</legend>
              <div class="choices">
                <label
                  ><input
                    type="radio"
                    name="outline"
                    value="none"
                    checked
                  />なし</label
                >
                <label
                  ><input type="radio" name="outline" value="white" />白</label
                >
                <label
                  ><input type="radio" name="outline" value="black" />黒</label
                >
              </div>
            </fieldset>
          </div>
        </details>

        <details class="setting">
          <summary>背景画像 <span>アップロード・位置調整</span></summary>
          <div class="setting-content">
            <label for="fileUpload">画像ファイル</label>
            <input type="file" id="fileUpload" accept="image/*" />
            <div class="two-columns image-controls">
              <label for="posX"
                >横位置（px）<input type="number" id="posX" value="0"
              /></label>
              <label for="posY"
                >縦位置（px）<input type="number" id="posY" value="0"
              /></label>
              <label for="size"
                >拡大率（%）<input type="number" id="size" value="100"
              /></label>
              <label for="angle"
                >角度（度）<input type="number" id="angle" value="0"
              /></label>
            </div>
          </div>
        </details>
      </section>
    </main>

    <footer class="footer">
      <span>#縦書き画像メーカー</span>
      <div>
        <a href="https://twitter.com/akami0000">製作者：あかみ</a>
        <a href="https://github.com/akami0000/make-textcard">GitHub</a>
      </div>
    </footer>
  </body>
</html>
